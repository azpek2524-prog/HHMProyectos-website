<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}a{color:inherit;text-decoration:none}a:hover{color:inherit}h1,h2,h3,h4,p{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}input:focus,textarea:focus{outline:none;border-color:#162456}</style></helmet>
<div style="font-family:Inter,system-ui,sans-serif;color:#101828;background:#fff;container-type:inline-size">
  <dc-import name="HHM Nav" mobile="{{ mobile }}" theme="light" active="Contacto" hint-size="100%,84px"></dc-import>
  <div style="display:grid;grid-template-columns:repeat({{ progN }},1fr);gap:4px;padding:0 clamp(20px,4cqw,32px);margin-top:20px"><sc-for list="{{ prog }}" as="p" hint-placeholder-count="5"><span style="height:3px;background:{{ p.c }}"></span></sc-for></div>
  <section style="padding:clamp(32px,5cqw,72px) clamp(20px,4cqw,32px) clamp(48px,6cqw,88px)">
    <div style="max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(32px,5cqw,80px);align-items:start">
      <div style="grid-column:{{ qSpan }};display:flex;flex-direction:column;gap:clamp(24px,3cqw,36px);min-height:clamp(420px,40cqw,520px)">
        <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
          <p style="font:600 13px ui-monospace,Menlo,monospace;color:#6a7282;letter-spacing:.06em">COTIZACIÓN · {{ stepN }} / 5</p>
          <h1 style="font-size:clamp(32px,4.6cqw,64px);font-weight:800;letter-spacing:-0.045em;line-height:1;text-wrap:balance">{{ q }}</h1>
          <sc-if value="{{ hasOpts }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-direction:column;border-top:1px solid #101828">
              <sc-for list="{{ opts }}" as="o" hint-placeholder-count="5"><button onClick="{{ o.pick }}" style="border:0;border-bottom:1px solid #d1d5dc;background:{{ o.bg }};color:{{ o.fg }};padding:18px 16px;display:flex;gap:18px;align-items:center;text-align:left" style-hover="padding-left:24px"><span style="width:28px;height:28px;border:1px solid {{ o.kbd }};font:600 12px ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;flex:none">{{ o.key }}</span><span style="flex:1;font-size:clamp(18px,1.8cqw,22px);font-weight:600;letter-spacing:-0.01em">{{ o.label }}</span><span style="font-size:18px">{{ o.mark }}</span></button></sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ isFiles }}">
            <div style="display:flex;flex-direction:column;gap:14px">
              <label style="border:1px dashed #101828;padding:clamp(24px,4cqw,44px);display:flex;flex-direction:column;gap:8px;cursor:pointer;background:#f9fafb"><input type="file" multiple onChange="{{ addFiles }}" style="display:none"><span style="font-size:clamp(18px,1.8cqw,22px);font-weight:700">+ Subir planos</span><span style="font-size:14px;color:#6a7282">PDF, DWG, RVT o imágenes · hasta 50 MB</span></label>
              <sc-if value="{{ hasFiles }}"><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ files }}" as="f"><span style="font-size:13px;background:#101828;color:#fff;padding:6px 10px">{{ f }}</span></sc-for></div></sc-if>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 20px">
                <input placeholder="Nombre" style="padding:16px 0;border:0;border-bottom:1px solid #d1d5dc;font-size:17px"><input placeholder="Despacho o constructora" style="padding:16px 0;border:0;border-bottom:1px solid #d1d5dc;font-size:17px"><input placeholder="Correo" style="padding:16px 0;border:0;border-bottom:1px solid #d1d5dc;font-size:17px"><input placeholder="WhatsApp" style="padding:16px 0;border:0;border-bottom:1px solid #d1d5dc;font-size:17px">
              </div>
            </div>
          </sc-if>
          <div style="display:flex;gap:12px;align-items:center;margin-top:auto">
            <button onClick="{{ next }}" style="border:0;background:#162456;color:#fff;padding:16px 24px;font-weight:600;display:flex;gap:12px" style-hover="background:#1c398e">{{ nextLabel }} <span>→</span></button>
            <sc-if value="{{ canBack }}"><button onClick="{{ back }}" style="border:0;background:none;padding:16px 8px;color:#4a5565;font-weight:600">Atrás</button></sc-if>
            <sc-if value="{{ desktop }}"><span style="font-size:13px;color:#99a1af;margin-left:auto">Puedes saltar cualquier pregunta</span></sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ done }}">
          <p style="font:600 13px ui-monospace,Menlo,monospace;color:#1c398e;letter-spacing:.06em">ENVIADO</p>
          <h1 style="font-size:clamp(34px,5cqw,72px);font-weight:800;letter-spacing:-0.045em;line-height:1">Gracias. Ya estamos revisando tus planos.</h1>
          <p style="font-size:18px;color:#4a5565;max-width:520px;line-height:1.55">Te contactamos por correo o WhatsApp con alcance y propuesta.</p>
          <button onClick="{{ reset }}" style="align-self:flex-start;border:1px solid #101828;background:#fff;padding:12px 18px;font-weight:600">Nueva solicitud</button>
        </sc-if>
      </div>
      <aside style="background:#030712;color:#fff;padding:clamp(24px,3cqw,36px);display:flex;flex-direction:column;gap:6px;position:sticky;top:24px">
        <p style="font:600 12px ui-monospace,Menlo,monospace;color:#bedbff;letter-spacing:.06em;margin-bottom:12px">TU SOLICITUD</p>
        <sc-for list="{{ summary }}" as="r" hint-placeholder-count="5"><div style="display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid #1e2939"><span style="font-size:12px;color:#99a1af">{{ r.k }}</span><span style="font-size:17px;font-weight:600;color:{{ r.c }}">{{ r.v }}</span></div></sc-for>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px"><a href="#" style="border:1px solid #364153;padding:14px 16px;display:flex;justify-content:space-between;font-weight:600" style-hover="background:#101828">Mejor por WhatsApp <span>→</span></a><a href="#" style="border:1px solid #364153;padding:14px 16px;display:flex;justify-content:space-between;font-weight:600;font-size:14px" style-hover="background:#101828">contacto@hhmproyectos.com <span>→</span></a></div>
      </aside>
    </div>
  </section>
  <dc-import name="HHM Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { step: 0, a: { tipo: null, alcance: [], m2: null, etapa: null }, files: [], done: false };
  renderVals() {
    const S = this.state, mobile = !!this.props.mobile;
    const steps = [
      { k: 'tipo', q: '¿Qué vamos a construir?', opts: ['Casa habitación', 'Edificio residencial', 'Oficinas', 'Comercio o restaurante', 'Industrial', 'Remodelación'] },
      { k: 'alcance', multi: true, q: '¿Qué instalaciones necesitas?', opts: ['Plomería', 'Electricidad', 'Proyecto ejecutivo', 'Mantenimiento'] },
      { k: 'm2', q: '¿Cuántos m² de construcción, aprox.?', opts: ['Menos de 500 m²', '500 – 2,000 m²', '2,000 – 10,000 m²', 'Más de 10,000 m²'] },
      { k: 'etapa', q: '¿En qué etapa está?', opts: ['Anteproyecto', 'Proyecto ejecutivo', 'En obra', 'Operación / mantenimiento'] },
      { k: 'files', q: 'Sube tus planos y dinos cómo contactarte.' }
    ];
    const cur = steps[S.step];
    const setA = (k, v) => this.setState(s => ({ a: { ...s.a, [k]: v } }));
    const opts = (cur.opts || []).map((label, i) => {
      const val = S.a[cur.k];
      const on = cur.multi ? val.includes(label) : val === label;
      return { label, key: 'ABCDEF'[i], mark: on ? '✓' : '', bg: on ? '#162456' : '#fff', fg: on ? '#fff' : '#101828', kbd: on ? '#fff' : '#101828',
        pick: () => cur.multi ? setA(cur.k, on ? val.filter(x => x !== label) : [...val, label]) : (setA(cur.k, label), setTimeout(() => this.setState(s => ({ step: Math.min(4, s.step + 1) })), 220)) };
    });
    const show = v => (Array.isArray(v) ? v.join(', ') : v) || 'Pendiente';
    const c = v => ((Array.isArray(v) ? v.length : v) ? '#fff' : '#6a7282');
    return {
      mobile, desktop: !mobile, qSpan: mobile ? 'auto' : 'span 2',
      notDone: !S.done, done: S.done, stepN: S.step + 1, q: cur.q,
      progN: 5, prog: steps.map((_, i) => ({ c: S.done || i <= S.step ? '#162456' : '#e5e7eb' })),
      hasOpts: !!cur.opts, isFiles: cur.k === 'files', opts,
      files: S.files, hasFiles: S.files.length > 0,
      addFiles: e => { const n = Array.from(e.target.files || []).map(f => f.name); this.setState(s => ({ files: [...s.files, ...n] })); },
      canBack: S.step > 0,
      back: () => this.setState(s => ({ step: s.step - 1 })),
      next: () => S.step < 4 ? this.setState({ step: S.step + 1 }) : this.setState({ done: true }),
      nextLabel: S.step < 4 ? 'Siguiente' : 'Enviar solicitud',
      reset: () => this.setState({ step: 0, a: { tipo: null, alcance: [], m2: null, etapa: null }, files: [], done: false }),
      summary: [
        { k: 'Proyecto', v: show(S.a.tipo), c: c(S.a.tipo) },
        { k: 'Instalaciones', v: show(S.a.alcance), c: c(S.a.alcance) },
        { k: 'Superficie', v: show(S.a.m2), c: c(S.a.m2) },
        { k: 'Etapa', v: show(S.a.etapa), c: c(S.a.etapa) },
        { k: 'Planos', v: S.files.length ? S.files.length + ' archivo(s)' : 'Pendiente', c: c(S.files) }
      ]
    };
  }
}
</script>
</body>
</html>
